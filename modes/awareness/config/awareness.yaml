#config_version=6
# modes/awareness/config/awareness.yaml
#
# ------------------------------------------------------------
# THEY LIVE - AWARENESS / CONSUME QUALIFICATION
# ------------------------------------------------------------
#
# Build Awareness through normal gameplay.
#
# Qualification targets:
#
#   Mystery 1 = 100
#   Mystery 2 = 175
#   Mystery 3 = 275
#   Mystery 4+ = 400
#
# DISPLAY:
#
#   0% - 24%
#       No Awareness widget
#
#   25% - 99%
#       Persistent awareness_progress_widget
#       Godot will display:
#
#           AWARENESS
#           XX%
#
#       Percentage will be calculated from:
#
#           awareness / awareness_target
#
#   100%
#       Remove awareness_progress_widget
#
#       Show objective_widget:
#
#           HIT LEFT LOCK
#           TO START CONSUME
#
#       Start CONSUME-qualified lightshow
#
# When qualified:
#   s_81_saucer_left starts BRAIN ROT / CONSUME
#
# Awareness progress is per-player and carries between balls.
# ------------------------------------------------------------


mode:
  start_events: ball_starting
  stop_events: game_ending
  priority: 105


# ------------------------------------------------------------
# EVENT LOGIC
# ------------------------------------------------------------

event_player:

  # ----------------------------------------------------------
  # RESTORE DISPLAY ON A NEW BALL
  #
  # Awareness player variables persist between balls, but
  # mode widgets/shows may be removed when the previous ball
  # ends.
  #
  # If the player is already >=25%, restore the progress
  # widget.
  #
  # If already qualified, restore the CONSUME-ready display.
  # ----------------------------------------------------------

  mode_awareness_started{current_player.awareness_qualified == 0 and current_player.awareness * 4 >= current_player.awareness_target}:
    awareness_progress_display_start

  mode_awareness_started{current_player.awareness_qualified == 1}:
    awareness_consume_ready_display


  # ----------------------------------------------------------
  # POPS
  # +1
  # ----------------------------------------------------------

  s_56_pop_bumper_right_active{current_player.awareness_qualified == 0}:
    awareness_add_1

  s_57_pop_bumper_center_active{current_player.awareness_qualified == 0}:
    awareness_add_1

  s_58_pop_bumper_left_active{current_player.awareness_qualified == 0}:
    awareness_add_1


  # ----------------------------------------------------------
  # SLINGSHOTS
  # +1
  # ----------------------------------------------------------

  s_34_right_sling_active{current_player.awareness_qualified == 0}:
    awareness_add_1

  s_37_left_sling_active{current_player.awareness_qualified == 0}:
    awareness_add_1


  # ----------------------------------------------------------
  # INLANES
  # +2
  # ----------------------------------------------------------

  s_32_right_inlane_active{current_player.awareness_qualified == 0}:
    awareness_add_2

  s_35_left_inlane_active{current_player.awareness_qualified == 0}:
    awareness_add_2


  # ----------------------------------------------------------
  # SPINNERS
  # +2 per pulse
  # ----------------------------------------------------------

  s_71_spinner_left_active{current_player.awareness_qualified == 0}:
    awareness_add_2

  s_44_spinner_right_active{current_player.awareness_qualified == 0}:
    awareness_add_2


  # ----------------------------------------------------------
  # TOP LANES
  # +3
  # ----------------------------------------------------------

  s_60_top_lane_c_active{current_player.awareness_qualified == 0}:
    awareness_add_3

  s_61_top_lane_b_active{current_player.awareness_qualified == 0}:
    awareness_add_3

  s_62_top_lane_a_active{current_player.awareness_qualified == 0}:
    awareness_add_3


  # ----------------------------------------------------------
  # INDIVIDUAL STANDUPS
  # +4
  # ----------------------------------------------------------

  s_40_stand_up_target_5_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_41_stand_up_target_6_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_42_stand_up_target_1_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_43_stand_up_target_4_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_63_stand_up_target_3_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_80_stand_up_target_2_active{current_player.awareness_qualified == 0}:
    awareness_add_4


  # ----------------------------------------------------------
  # SIX STANDUPS BEHIND DROP TARGETS
  # +4
  # ----------------------------------------------------------

  s_82_stand_up_target_bank_1_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_83_stand_up_target_bank_2_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_84_stand_up_target_bank_3_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_85_stand_up_target_bank_4_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_86_stand_up_target_bank_5_active{current_player.awareness_qualified == 0}:
    awareness_add_4

  s_87_stand_up_target_bank_6_active{current_player.awareness_qualified == 0}:
    awareness_add_4


  # ----------------------------------------------------------
  # DROP TARGETS
  # +5
  # ----------------------------------------------------------

  s_72_single_drop_1_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_73_fourbank_drop_1_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_74_fourbank_drop_2_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_75_fourbank_drop_3_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_76_fourbank_drop_4_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_77_threebank_drop_1_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_78_threebank_drop_2_active{current_player.awareness_qualified == 0}:
    awareness_add_5

  s_79_threebank_drop_3_active{current_player.awareness_qualified == 0}:
    awareness_add_5


  # ----------------------------------------------------------
  # VARI-TARGET
  #
  # Existing varitarget.yaml posts:
  #
  #   varitarget_moved_1
  #   ...
  #   varitarget_moved_6
  # ----------------------------------------------------------

  varitarget_moved_1{current_player.awareness_qualified == 0}:
    awareness_add_2

  varitarget_moved_2{current_player.awareness_qualified == 0}:
    awareness_add_4

  varitarget_moved_3{current_player.awareness_qualified == 0}:
    awareness_add_6

  varitarget_moved_4{current_player.awareness_qualified == 0}:
    awareness_add_8

  varitarget_moved_5{current_player.awareness_qualified == 0}:
    awareness_add_12

  varitarget_moved_6{current_player.awareness_qualified == 0}:
    awareness_add_20


  # ----------------------------------------------------------
  # AWARENESS PROGRESS DISPLAY
  #
  # Start the persistent widget ONLY when Awareness crosses
  # from below 25% to 25% or above.
  #
  # value and prev_value are supplied by the player_awareness
  # event.
  # ----------------------------------------------------------

  player_awareness{current_player.awareness_qualified == 0 and value * 4 >= current_player.awareness_target and prev_value * 4 < current_player.awareness_target}:
    awareness_progress_display_start


  # ----------------------------------------------------------
  # FULL QUALIFICATION - 100%
  # ----------------------------------------------------------

  player_awareness{current_player.awareness_qualified == 0 and current_player.awareness >= current_player.awareness_target}:
    awareness_qualified


  # ----------------------------------------------------------
  # QUALIFIED PRESENTATION
  #
  # Replace the progress widget with:
  #
  #   HIT LEFT LOCK
  #   TO START CONSUME
  #
  # Also start the qualification lightshow event.
  # ----------------------------------------------------------

  awareness_qualified:
    - awareness_consume_ready_display
    - awareness_consume_ready_lightshow_start


  # ----------------------------------------------------------
  # START BRAIN ROT / CONSUME
  #
  # Left saucer starts Brain Rot / CONSUME.
  #
  # First remove the qualification presentation, then start
  # the mode.
  # ----------------------------------------------------------

  s_81_saucer_left_active{current_player.awareness_qualified == 1}:
    - awareness_consume_ready_display_stop
    - awareness_consume_ready_lightshow_stop
    - start_mode_brain_rot


  # ----------------------------------------------------------
  # BRAIN ROT HAS COMPLETED
  #
  # Do NOT reset Awareness yet.
  #
  # Leave qualification state intact while the completion
  # animation and locked-ball releases occur.
  # ----------------------------------------------------------

  brain_rot_complete:
    awareness_brain_rot_won


  # ----------------------------------------------------------
  # BRAIN ROT MODE HAS FINISHED
  #
  # Now consume the qualification and start the next cycle.
  # ----------------------------------------------------------

  mode_brain_rot_stopped:
    awareness_finish_brain_rot


  # ----------------------------------------------------------
  # DETERMINE NEXT QUALIFICATION TARGET
  #
  # This happens BEFORE the collection count is incremented.
  # ----------------------------------------------------------

  awareness_finish_brain_rot{current_player.awareness_mysteries_collected == 0}:
    awareness_next_target_175

  awareness_finish_brain_rot{current_player.awareness_mysteries_collected == 1}:
    awareness_next_target_275

  awareness_finish_brain_rot{current_player.awareness_mysteries_collected >= 2}:
    awareness_next_target_400


# ------------------------------------------------------------
# PLAYER VARIABLES
# ------------------------------------------------------------

variable_player:
  

  # ----------------------------------------------------------
  # AWARENESS AWARDS
  # ----------------------------------------------------------

  awareness_add_1:
    awareness:
      action: add
      int: 1

  awareness_add_2:
    awareness:
      action: add
      int: 2

  awareness_add_3:
    awareness:
      action: add
      int: 3

  awareness_add_4:
    awareness:
      action: add
      int: 4

  awareness_add_5:
    awareness:
      action: add
      int: 5

  awareness_add_6:
    awareness:
      action: add
      int: 6

  awareness_add_8:
    awareness:
      action: add
      int: 8

  awareness_add_12:
    awareness:
      action: add
      int: 12

  awareness_add_20:
    awareness:
      action: add
      int: 20
  # ----------------------------------------------------------
  # INITIALISE AWARENESS PERCENTAGE
  # ----------------------------------------------------------

  mode_awareness_started{current_player.awareness_target > 0}:
    awareness_percent:
      action: set
      int: (current_player.awareness * 100) / current_player.awareness_target


  # ----------------------------------------------------------
  # UPDATE AWARENESS PERCENTAGE
  # ----------------------------------------------------------

  player_awareness{current_player.awareness_target > 0}:
    awareness_percent:
      action: set
      int: (current_player.awareness * 100) / current_player.awareness_target


  # ----------------------------------------------------------
  # QUALIFIED
  # ----------------------------------------------------------

  awareness_qualified:

    awareness_qualified:
      action: set
      int: 1


  # ----------------------------------------------------------
  # BRAIN ROT / CONSUME FINISHED
  #
  # Reset the old qualification only AFTER Brain Rot has
  # completely stopped.
  # ----------------------------------------------------------

  awareness_finish_brain_rot:

    awareness:
      action: set
      int: 0
    
    awareness_percent:
      action: set
      int: 0

    awareness_qualified:
      action: set
      int: 0

    awareness_mysteries_collected:
      action: add
      int: 1


  # ----------------------------------------------------------
  # NEXT QUALIFICATION TARGET
  # ----------------------------------------------------------

  awareness_next_target_175:

    awareness_target:
      action: set
      int: 175


  awareness_next_target_275:

    awareness_target:
      action: set
      int: 275


  awareness_next_target_400:

    awareness_target:
      action: set
      int: 400


# ------------------------------------------------------------
# GODOT WIDGETS
# ------------------------------------------------------------
#
# These are the TWO new widgets we will create in Godot next:
#
#   awareness_progress_widget
#
#       Persistent from 25% through 99%.
#
#       Godot will use:
#
#           player awareness
#           player awareness_target
#
#       to calculate and display the current percentage.
#
#
#   objective_widget
#
#       Persistent after 100% qualification.
#
#       Displays:
#
#           HIT LEFT LOCK
#           TO START CONSUME
#
# ------------------------------------------------------------

widget_player:

  # ----------------------------------------------------------
  # 25% - 99%
  #
  # Start the persistent Awareness progress display.
  #
  # NO EXPIRE.
  # It remains present until explicitly removed.
  # ----------------------------------------------------------

  awareness_progress_display_start:

    awareness_progress_widget:
      action: play
      priority: 10000


  # ----------------------------------------------------------
  # 100% QUALIFIED
  #
  # Remove Awareness percentage widget.
  # Replace it with the CONSUME-ready widget.
  # ----------------------------------------------------------

  awareness_consume_ready_display:

    awareness_progress_widget:
      action: remove

    objective_widget:
      action: play
      priority: 10000
      tokens:
        objective_text: |
          HIT LEFT LOCK
          TO START CONSUME

    arrow_straight_widget:
      action: play
      priority: 5500
      tokens:
        arrow_position: left_lock

  # ----------------------------------------------------------
  # LEFT LOCK HIT / CONSUME STARTING
  #
  # Remove the qualification widget.
  # ----------------------------------------------------------

  awareness_consume_ready_display_stop:

    objective_widget:
      action: remove
      
    arrow_straight_widget:
      action: remove


# ------------------------------------------------------------
# CONSUME QUALIFIED LIGHTSHOW
# ------------------------------------------------------------

show_player:

  awareness_consume_ready_lightshow_start:
    show_consume_qualified:
      action: play
      key: consume_qualified_insert
      priority: 5000
      loops: -1
      speed: 1.0

  awareness_consume_ready_lightshow_stop:
    consume_qualified_insert:
      action: stop