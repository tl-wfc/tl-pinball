#config_version=6
# modes/brain_rot/config/brain_rot.yaml


mode:
  start_events: start_mode_brain_rot
  stop_events: brain_rot_stop
  priority: 1000


# ------------------------------------------------------------
# 3 BALL MULTIBALL
# ------------------------------------------------------------

multiballs:

  brain_rot_multiball:
    ball_count: 3
    ball_count_type: total

    shoot_again: 15s
    hurry_up_time: 5s
    grace_period: 2s

    enable_events:
      - brain_rot_multiball_enable

    reset_events:
      - brain_rot_multiball_reset

    start_events:
      - brain_rot_launch_multiball

    stop_events:
      - brain_rot_multiball_stop
      - mode_brain_rot_stopping

# ------------------------------------------------------------
# SAUCER BALL HOLDS
# ------------------------------------------------------------

ball_holds:

  brain_rot_left_saucer_hold:
    hold_devices: bd_left_vuk
    balls_to_hold: 1

    enable_events:
      - brain_rot_left_saucer_open

    release_all_events:
      - brain_rot_complete
      - mode_brain_rot_stopping


  brain_rot_right_saucer_hold:
    hold_devices: bd_right_vuk
    balls_to_hold: 1

    enable_events:
      - brain_rot_right_saucer_open

    release_all_events:
      - brain_rot_complete
      - mode_brain_rot_stopping


# ------------------------------------------------------------
# TIMERS
# ------------------------------------------------------------

timers:

  # ----------------------------------------------------------
  # MODE END DELAY
  # ----------------------------------------------------------

  brain_rot_end_delay:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s

    control_events:
      - event: brain_rot_end_delay_start
        action: restart


  # ----------------------------------------------------------
  # OBJECTIVE WIDGET REFRESH DELAYS
  #
  # These allow the old objective_widget to be fully removed
  # before GMC creates the next instance.
  # ----------------------------------------------------------

  brain_rot_left_lock_display_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 100ms

    control_events:
      - event: brain_rot_left_saucer_open
        action: restart


  brain_rot_right_spinner_display_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 100ms

    control_events:
      - event: brain_rot_left_ball_locked
        action: restart


  brain_rot_right_lock_display_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 100ms

    control_events:
      - event: brain_rot_right_saucer_open
        action: restart


  brain_rot_varitarget_display_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 100ms

    control_events:
      - event: brain_rot_right_ball_locked
        action: restart

  brain_rot_multiball_reset_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 50ms

    control_events:
      - event: brain_rot_multiball_prepare
        action: restart

# ------------------------------------------------------------
# EVENT LOGIC
# ------------------------------------------------------------

event_player:

  # ----------------------------------------------------------
  # MODE START
  #
  # Ball is sitting in bd_left_vuk.
  # Eject that ball to begin Brain Rot.
  # ----------------------------------------------------------

  mode_brain_rot_started:
    - brain_rot_intro
    - brain_rot_multiball_reset
    - brain_rot_multiball_prepare
    - brain_rot_eject_start_ball

  timer_brain_rot_multiball_reset_delay_complete:
    brain_rot_multiball_enable

# ----------------------------------------------------------
  # START MULTIBALL
  #
  # Once the starting ball physically leaves the left saucer,
  # bring balls in play up to a total of three.
  # ----------------------------------------------------------

  s_81_saucer_left_inactive{current_player.brain_rot_stage == 0 and current_player.brain_rot_multiball_started == 0}:
    brain_rot_launch_multiball


  # ----------------------------------------------------------
  # ENTER STAGE 1
  # ----------------------------------------------------------

  brain_rot_launch_multiball:
    brain_rot_multiball_started


  brain_rot_multiball_started:
    brain_rot_left_spinner_objective


  # ----------------------------------------------------------
  # STAGE 1
  #
  # HIT LEFT SPINNER
  # ----------------------------------------------------------

  s_71_spinner_left_active{current_player.brain_rot_stage == 1}:
    brain_rot_left_saucer_open


  # ----------------------------------------------------------
  # STAGE 2
  #
  # LEFT SAUCER HOLD ENABLED
  #
  # Wait until the ball hold confirms it claimed the ball.
  # ----------------------------------------------------------

  ball_hold_brain_rot_left_saucer_hold_held_ball{current_player.brain_rot_stage == 2}:
    brain_rot_left_ball_locked


  # ----------------------------------------------------------
  # STAGE 3
  #
  # HIT RIGHT SPINNER
  # ----------------------------------------------------------

  s_44_spinner_right_active{current_player.brain_rot_stage == 3}:
    brain_rot_right_saucer_open


  # ----------------------------------------------------------
  # STAGE 4
  #
  # RIGHT SAUCER HOLD ENABLED
  #
  # Wait until the ball hold confirms it owns the ball.
  # ----------------------------------------------------------

  ball_hold_brain_rot_right_saucer_hold_held_ball{current_player.brain_rot_stage == 4}:
    brain_rot_right_ball_locked


  # ----------------------------------------------------------
  # STAGE 5
  #
  # ONE BALL REMAINS LIVE.
  # ANY GENUINE FORWARD VARI-TARGET HIT COMPLETES THE MODE.
  # ----------------------------------------------------------

  varitarget_hit_begin{current_player.brain_rot_stage == 5}:
    brain_rot_complete


  # ----------------------------------------------------------
  # COMPLETE
  # ----------------------------------------------------------

  brain_rot_complete:
    - brain_rot_reward_won
    - brain_rot_multiball_stop
    - brain_rot_end_delay_start

  # ----------------------------------------------------------
  # END MODE AFTER COMPLETION CELEBRATION
  # ----------------------------------------------------------

  timer_brain_rot_end_delay_complete:
    brain_rot_stop


  # ----------------------------------------------------------
  # MULTIBALL FAILURE
  #
  # MPF posts this when Brain Rot loses a multiball ball
  # which is not being replaced by shoot-again.
  # ----------------------------------------------------------

  multiball_brain_rot_multiball_ball_lost{current_player.brain_rot_stage >= 1 and current_player.brain_rot_stage < 6}:
    brain_rot_failed


  brain_rot_failed:
    - brain_rot_multiball_stop
    - brain_rot_stop


# ------------------------------------------------------------
# PLAYER STATE
# ------------------------------------------------------------

variable_player:

  # ----------------------------------------------------------
  # MODE START
  #
  # Stage 0 = waiting for starting left-saucer ball to leave.
  # ----------------------------------------------------------

  mode_brain_rot_started:

    brain_rot_stage:
      action: set
      int: 0

    brain_rot_multiball_started:
      action: set
      int: 0

    brain_rot_left_saucer_open:
      action: set
      int: 0

    brain_rot_left_ball_locked:
      action: set
      int: 0

    brain_rot_right_saucer_open:
      action: set
      int: 0

    brain_rot_right_ball_locked:
      action: set
      int: 0


  # ----------------------------------------------------------
  # MULTIBALL STARTED
  #
  # Stage 1 = hit left spinner.
  # ----------------------------------------------------------

  brain_rot_multiball_started:

    brain_rot_stage:
      action: set
      int: 1

    brain_rot_multiball_started:
      action: set
      int: 1


  # ----------------------------------------------------------
  # LEFT SPINNER MADE
  #
  # Stage 2 = left lock lit.
  # ----------------------------------------------------------

  brain_rot_left_saucer_open:

    brain_rot_stage:
      action: set
      int: 2

    brain_rot_left_saucer_open:
      action: set
      int: 1


  # ----------------------------------------------------------
  # LEFT BALL LOCKED
  #
  # Stage 3 = hit right spinner.
  # ----------------------------------------------------------

  brain_rot_left_ball_locked:

    brain_rot_stage:
      action: set
      int: 3

    brain_rot_left_ball_locked:
      action: set
      int: 1


  # ----------------------------------------------------------
  # RIGHT SPINNER MADE
  #
  # Stage 4 = right lock lit.
  # ----------------------------------------------------------

  brain_rot_right_saucer_open:

    brain_rot_stage:
      action: set
      int: 4

    brain_rot_right_saucer_open:
      action: set
      int: 1


  # ----------------------------------------------------------
  # RIGHT BALL LOCKED
  #
  # Stage 5 = hit vari-target.
  # ----------------------------------------------------------

  brain_rot_right_ball_locked:

    brain_rot_stage:
      action: set
      int: 5

    brain_rot_right_ball_locked:
      action: set
      int: 1


  # ----------------------------------------------------------
  # COMPLETE
  # ----------------------------------------------------------

  brain_rot_complete:

    brain_rot_stage:
      action: set
      int: 6


# ------------------------------------------------------------
# STARTING SAUCER EJECT
# ------------------------------------------------------------

coil_player:

  brain_rot_eject_start_ball:

    c_29_saucer_left:
      action: pulse


# ------------------------------------------------------------
# GODOT AWARD POPUP / MODE TITLE / OBJECTIVE WIDGETS
# ------------------------------------------------------------

widget_player:

  # ----------------------------------------------------------
  # INTRO VIDEO + MODE TITLE
  # ----------------------------------------------------------

  brain_rot_intro:

    # award_popup_widget:
    #   action: play
    #   priority: 5000
    #   tokens:
    #     award_video: "tl-v-aerobic"

    mode_title_widget:
      action: play
      priority: 7000
      tokens:
        award_text: "CONSUME"
  # ----------------------------------------------------------
  # RANDOM BRAIN ROT VIDEO
  # ----------------------------------------------------------

  brain_rot_video_aerobic:

    award_popup_widget:
      action: play
      priority: 5000
      tokens:
        award_video: "tl-v-aerobic"


  brain_rot_video_willie:

    award_popup_widget:
      action: play
      priority: 5000
      tokens:
        award_video: "tl-v-willie"


  # brain_rot_video_shoebody:

  #   award_popup_widget:
  #     action: play
  #     priority: 5000
  #     tokens:
  #       award_video: "tl-v-shoebody"


  # brain_rot_video_space:

  #   award_popup_widget:
  #     action: play
  #     priority: 5000
  #     tokens:
  #       award_video: "tl-v-space"
  
  
  # brain_rot_video_makelove:

  #   award_popup_widget:
  #     action: play
  #     priority: 5000
  #     tokens:
  #       award_video: "tl-v-makelove"
  
  
  brain_rot_video_ideas:

    award_popup_widget:
      action: play
      priority: 5000
      tokens:
        award_video: "tl-v-ideas"


  brain_rot_video_doot:

    award_popup_widget:
      action: play
      priority: 5000
      tokens:
        award_video: "tl-v-doot"
 

  # ----------------------------------------------------------
  # STAGE 1 - HIT LEFT SPINNER
  #
  # First objective can be played directly because there is
  # no previous Brain Rot objective widget to remove.
  # ----------------------------------------------------------

  brain_rot_left_spinner_objective:

    objective_widget:
      action: play
      priority: 6000
      tokens:
        objective_text: |
          HIT LEFT
          SPINNER

    arrow_straight_widget:
      action: play
      priority: 5500
      tokens:
        arrow_position: left_spinner



  # ----------------------------------------------------------
  # STAGE 1 COMPLETE
  #
  # Remove HIT LEFT SPINNER immediately.
  # ----------------------------------------------------------

  brain_rot_left_saucer_open:

    objective_widget:
      action: remove

    arrow_straight_widget:
      action: remove


  # ----------------------------------------------------------
  # STAGE 2 - LEFT LOCK LIT
  #
  # Played 100ms after the previous widget was removed.
  # ----------------------------------------------------------

  timer_brain_rot_left_lock_display_delay_complete:

    objective_widget:
      action: play
      priority: 6000
      tokens:
        objective_text: |
          LEFT LOCK
          LIT

    arrow_straight_widget:
      action: play
      priority: 5500
      tokens:
        arrow_position: left_lock



  # ----------------------------------------------------------
  # STAGE 2 COMPLETE
  #
  # Remove LEFT LOCK LIT.
  # ----------------------------------------------------------

  brain_rot_left_ball_locked:

    objective_widget:
      action: remove


  # ----------------------------------------------------------
  # STAGE 3 - HIT RIGHT SPINNER
  # ----------------------------------------------------------

  timer_brain_rot_right_spinner_display_delay_complete:

    objective_widget:
      action: play
      priority: 6000
      tokens:
        objective_text: |
          HIT RIGHT
          SPINNER

    arrow_straight_widget:
      action: play
      priority: 5500
      tokens:
        arrow_position: right_spinner

  # ----------------------------------------------------------
  # STAGE 3 COMPLETE
  #
  # Remove HIT RIGHT SPINNER.
  # ----------------------------------------------------------

  brain_rot_right_saucer_open:

    objective_widget:
      action: remove

    arrow_straight_widget:
      action: remove


  # ----------------------------------------------------------
  # STAGE 4 - RIGHT LOCK LIT
  # ----------------------------------------------------------

  timer_brain_rot_right_lock_display_delay_complete:

    objective_widget:
      action: play
      priority: 6000
      tokens:
        objective_text: |
          RIGHT LOCK
          LIT

    arrow_straight_widget:
      action: play
      priority: 5500
      tokens:
        arrow_position: right_lock


  # ----------------------------------------------------------
  # STAGE 4 COMPLETE
  #
  # Remove RIGHT LOCK LIT.
  # ----------------------------------------------------------

  brain_rot_right_ball_locked:

    objective_widget:
      action: remove

    arrow_straight_widget:
      action: remove



  # ----------------------------------------------------------
  # STAGE 5 - HIT VARI TARGET
  # ----------------------------------------------------------

  timer_brain_rot_varitarget_display_delay_complete:

    objective_widget:
      action: play
      priority: 6000
      tokens:
        objective_text: |
          HIT VARI
          TARGET

    arrow_straight_widget:
      action: play
      priority: 5500
      tokens:
        arrow_position: varitarget

  # ----------------------------------------------------------
  # MODE COMPLETE
  # ----------------------------------------------------------

  brain_rot_reward_won:

    objective_widget:
      action: remove

    arrow_straight_widget:
      action: remove

    award_popup_widget:
      action: remove

    mode_title_widget:
      action: remove
    
    brain_rot_pass_widget:
      action: play
      priority: 9000
      tokens:
        award_text: |
          BRAIN ROT
          BROKEN


  # ----------------------------------------------------------
  # MODE FAILED
  # ----------------------------------------------------------

  brain_rot_failed:

    objective_widget:
      action: remove

    arrow_straight_widget:
      action: remove

    award_popup_widget:
      action: remove

    mode_title_widget:
      action: remove
    
    brain_rot_fail_widget:
      action: play
      priority: 9000
      tokens:
        award_text: |
          CONSUME
          FAILED

# ------------------------------------------------------------
# PLAYFIELD SHOWS - BRAIN ROT OBJECTIVES
# ------------------------------------------------------------

show_player:

  #first consume starts
  
  mode_brain_rot_started{current_player.consume_completed != 1}:

    show_consume_first_running:
      loops: -1
      priority: 2500
      key: consume_first_running_show

  mode_brain_rot_started{current_player.consume_completed == 1}:

    show_consume_active:
      loops: -1
      speed: 1.0
      priority: 2500
      key: consume_running_show

  # ----------------------------------------------------------
  # STAGE 1 - HIT LEFT SPINNER
  # ----------------------------------------------------------

  brain_rot_left_spinner_objective:

    show_left_spinner_green_1:
      loops: -1
      speed: 1.0
      priority: 2000
      key: brain_rot_stage_1_show


  # ----------------------------------------------------------
  # STAGE 1 COMPLETE
  # ----------------------------------------------------------

  brain_rot_left_saucer_open:

    brain_rot_stage_1_show:
      action: stop


  # ----------------------------------------------------------
  # STAGE 2 - LEFT LOCK LIT
  # ----------------------------------------------------------

  timer_brain_rot_left_lock_display_delay_complete:

    show_leftlock_green_1:
      loops: -1
      speed: 1.0
      priority: 2000
      key: brain_rot_stage_2_show


  # ----------------------------------------------------------
  # STAGE 2 COMPLETE
  # ----------------------------------------------------------

  brain_rot_left_ball_locked:

    brain_rot_stage_2_show:
      action: stop

  # ----------------------------------------------------------
  # STAGE 3 - HIT RIGHT SPINNER
  # ----------------------------------------------------------

  timer_brain_rot_right_spinner_display_delay_complete:

    show_right_spinner_green_1:
      loops: -1
      speed: 1.0
      priority: 2000
      key: brain_rot_stage_3_show


  # ----------------------------------------------------------
  # STAGE 3 COMPLETE
  # ----------------------------------------------------------

  brain_rot_right_saucer_open:

    brain_rot_stage_3_show:
      action: stop


  # ----------------------------------------------------------
  # STAGE 4 - RIGHT LOCK LIT
  # ----------------------------------------------------------

  timer_brain_rot_right_lock_display_delay_complete:

    show_right_pop_green_1:
      loops: -1
      speed: 1.0
      priority: 2000
      key: brain_rot_stage_4_show


  # ----------------------------------------------------------
  # STAGE 4 COMPLETE
  # ----------------------------------------------------------

  brain_rot_right_ball_locked:

    brain_rot_stage_4_show:
      action: stop


  # ----------------------------------------------------------
  # STAGE 5 - HIT VARI TARGET
  # ----------------------------------------------------------

  timer_brain_rot_varitarget_display_delay_complete:

    show_varitarget_green_1:
      loops: -1
      speed: 1.0
      priority: 2000
      key: brain_rot_stage_5_show


  # ----------------------------------------------------------
  # MODE COMPLETE
  # ----------------------------------------------------------

  brain_rot_complete:

    brain_rot_stage_1_show:
      action: stop

    brain_rot_stage_2_show:
      action: stop

    brain_rot_stage_3_show:
      action: stop

    brain_rot_stage_4_show:
      action: stop

    brain_rot_stage_5_show:
      action: stop

    consume_first_running_show:
      action: stop

    consume_running_show:
      action: stop
    # show_brain_rot_complete:
    #   loops: 1
    #   speed: 1.0
    #   priority: 3000
    #   key: brain_rot_complete_show


  # ----------------------------------------------------------
  # MODE FAILED
  # ----------------------------------------------------------

  brain_rot_failed:


    consume_first_running_show:
      action: stop

    consume_running_show:
      action: stop

    brain_rot_stage_1_show:
      action: stop

    brain_rot_stage_2_show:
      action: stop

    brain_rot_stage_3_show:
      action: stop

    brain_rot_stage_4_show:
      action: stop

    brain_rot_stage_5_show:
      action: stop
    


  # ----------------------------------------------------------
  # SAFETY CLEANUP
  # ----------------------------------------------------------

  mode_brain_rot_stopping:

    consume_first_running_show:
      action: stop

    consume_running_show:
      action: stop

    brain_rot_stage_1_show:
      action: stop

    brain_rot_stage_2_show:
      action: stop

    brain_rot_stage_3_show:
      action: stop

    brain_rot_stage_4_show:
      action: stop

    brain_rot_stage_5_show:
      action: stop

    # brain_rot_complete_show:
    #   action: stop

random_event_player:

  brain_rot_intro:
    events:
      - brain_rot_video_aerobic
      - brain_rot_video_willie
      # - brain_rot_video_shoebody
      # - brain_rot_video_space
      # - brain_rot_video_makelove
      - brain_rot_video_ideas
      - brain_rot_video_doot
    force_different: true
    force_all: true