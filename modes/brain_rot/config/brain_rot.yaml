#config_version=6
# modes/brain_rot/config/brain_rot.yaml


mode:
  start_events: start_mode_brain_rot
  stop_events: brain_rot_stop
  priority: 1000


# ------------------------------------------------------------
# 3 BALL MULTIBALL
# ------------------------------------------------------------

multiballs:

  brain_rot_multiball:
    ball_count: 3
    ball_count_type: total

    # Brain Rot multiball protection
    shoot_again: 15s
    hurry_up_time: 5s
    grace_period: 2s

    start_events:
      - brain_rot_launch_multiball

    stop_events:
      - brain_rot_multiball_stop
      - mode_brain_rot_stopping


# ------------------------------------------------------------
# SAUCER BALL HOLDS
# ------------------------------------------------------------

ball_holds:

  brain_rot_left_saucer_hold:
    hold_devices: bd_left_vuk
    balls_to_hold: 1

    enable_events:
      - brain_rot_left_saucer_open

    release_all_events:
      - brain_rot_complete
      - mode_brain_rot_stopping


  brain_rot_right_saucer_hold:
    hold_devices: bd_right_vuk
    balls_to_hold: 1

    enable_events:
      - brain_rot_right_saucer_open

    release_all_events:
      - brain_rot_complete
      - mode_brain_rot_stopping


# ------------------------------------------------------------
# END DELAY
# ------------------------------------------------------------

timers:

  brain_rot_end_delay:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s

    control_events:
      - event: brain_rot_end_delay_start
        action: restart


# ------------------------------------------------------------
# EVENT LOGIC
# ------------------------------------------------------------

event_player:

  # ----------------------------------------------------------
  # MODE START
  #
  # Ball is currently sitting in bd_right_vuk.
  # Tell that ball device to eject it.
  # ----------------------------------------------------------

  mode_brain_rot_started:
    - brain_rot_intro
    - brain_rot_eject_start_ball


  # ----------------------------------------------------------
  # START MULTIBALL
  #
  # Once the starting ball physically leaves the right saucer,
  # bring balls in play up to a total of three.
  # ----------------------------------------------------------

  s_59_saucer_right_inactive{current_player.brain_rot_stage == 0 and current_player.brain_rot_multiball_started == 0}:
    brain_rot_launch_multiball


  # ----------------------------------------------------------
  # USE MPF'S REAL MULTIBALL-STARTED EVENT
  #
  # This means stage 1 does not become active until MPF has
  # actually started the multiball.
  # ----------------------------------------------------------

  multiball_brain_rot_multiball_started:
    brain_rot_multiball_started


  brain_rot_multiball_started:
    brain_rot_left_spinner_objective


  # ----------------------------------------------------------
  # STAGE 1
  #
  # HIT LEFT SPINNER
  # ----------------------------------------------------------

  s_71_spinner_left_active{current_player.brain_rot_stage == 1}:
    brain_rot_left_saucer_open


  # ----------------------------------------------------------
  # STAGE 2
  #
  # LEFT SAUCER HOLD ENABLED
  #
  # Do NOT use s_81 directly to advance.
  # Wait until the ball hold confirms that it claimed a ball.
  # ----------------------------------------------------------

  ball_hold_brain_rot_left_saucer_hold_held_ball{current_player.brain_rot_stage == 2}:
    brain_rot_left_ball_locked


  brain_rot_left_ball_locked:
    brain_rot_right_spinner_objective


  # ----------------------------------------------------------
  # STAGE 3
  #
  # HIT RIGHT SPINNER
  # ----------------------------------------------------------

  s_44_spinner_right_active{current_player.brain_rot_stage == 3}:
    brain_rot_right_saucer_open


  # ----------------------------------------------------------
  # STAGE 4
  #
  # RIGHT SAUCER HOLD ENABLED
  #
  # Again, wait for the ball hold to confirm it owns the ball.
  # ----------------------------------------------------------

  ball_hold_brain_rot_right_saucer_hold_held_ball{current_player.brain_rot_stage == 4}:
    brain_rot_right_ball_locked


  brain_rot_right_ball_locked:
    brain_rot_varitarget_objective


  # ----------------------------------------------------------
  # STAGE 5
  #
  # ONE BALL REMAINS LIVE.
  # ANY GENUINE FORWARD VARI-TARGET HIT COMPLETES THE MODE.
  #
  # Your existing varitarget.yaml posts varitarget_hit_begin.
  # ----------------------------------------------------------

  varitarget_hit_begin{current_player.brain_rot_stage == 5}:
    brain_rot_complete


  # ----------------------------------------------------------
  # COMPLETE
  #
  # brain_rot_complete also releases both ball holds because
  # it is listed under release_all_events above.
  # ----------------------------------------------------------

  brain_rot_complete:
    - brain_rot_reward_won
    - brain_rot_end_delay_start


  # ----------------------------------------------------------
  # END MODE AFTER COMPLETION CELEBRATION BEGINS
  # ----------------------------------------------------------

  timer_brain_rot_end_delay_complete:
    brain_rot_stop

  # ----------------------------------------------------------
  # MULTIBALL FAILURE
  #
  # MPF posts this when Brain Rot actually loses a multiball
  # ball which is NOT being replaced by shoot-again.
  # ----------------------------------------------------------

  multiball_brain_rot_multiball_ball_lost{current_player.brain_rot_stage >= 1 and current_player.brain_rot_stage < 6}:
    brain_rot_failed


  brain_rot_failed:
    - brain_rot_multiball_stop
    - brain_rot_stop


# ------------------------------------------------------------
# PLAYER STATE
# ------------------------------------------------------------

variable_player:

  # ----------------------------------------------------------
  # MODE START
  #
  # Stage 0 = waiting for starting saucer ball to leave.
  # ----------------------------------------------------------

  mode_brain_rot_started:

    brain_rot_stage:
      action: set
      int: 0

    brain_rot_multiball_started:
      action: set
      int: 0

    brain_rot_left_saucer_open:
      action: set
      int: 0

    brain_rot_left_ball_locked:
      action: set
      int: 0

    brain_rot_right_saucer_open:
      action: set
      int: 0

    brain_rot_right_ball_locked:
      action: set
      int: 0


  # ----------------------------------------------------------
  # MULTIBALL ACTUALLY STARTED
  #
  # Stage 1 = left spinner objective.
  # ----------------------------------------------------------

  brain_rot_multiball_started:

    brain_rot_stage:
      action: set
      int: 1

    brain_rot_multiball_started:
      action: set
      int: 1


  # ----------------------------------------------------------
  # LEFT SPINNER MADE
  #
  # Stage 2 = left saucer can now capture a ball.
  # ----------------------------------------------------------

  brain_rot_left_saucer_open:

    brain_rot_stage:
      action: set
      int: 2

    brain_rot_left_saucer_open:
      action: set
      int: 1


  # ----------------------------------------------------------
  # LEFT BALL ACTUALLY HELD
  #
  # Stage 3 = right spinner objective.
  # ----------------------------------------------------------

  brain_rot_left_ball_locked:

    brain_rot_stage:
      action: set
      int: 3

    brain_rot_left_ball_locked:
      action: set
      int: 1


  # ----------------------------------------------------------
  # RIGHT SPINNER MADE
  #
  # Stage 4 = right saucer can now capture a ball.
  # ----------------------------------------------------------

  brain_rot_right_saucer_open:

    brain_rot_stage:
      action: set
      int: 4

    brain_rot_right_saucer_open:
      action: set
      int: 1


  # ----------------------------------------------------------
  # RIGHT BALL ACTUALLY HELD
  #
  # Stage 5 = vari-target objective.
  # ----------------------------------------------------------

  brain_rot_right_ball_locked:

    brain_rot_stage:
      action: set
      int: 5

    brain_rot_right_ball_locked:
      action: set
      int: 1


  # ----------------------------------------------------------
  # COMPLETE
  # ----------------------------------------------------------

  brain_rot_complete:

    brain_rot_stage:
      action: set
      int: 6


  # ----------------------------------------------------------
  # PLACEHOLDER REWARD
  # ----------------------------------------------------------

  # brain_rot_reward_won:
  #   score:
  #     action: add
  #     int: 25000000

coil_player:

  brain_rot_eject_start_ball:
    c_15_saucer_right:
      action: pulse


# ------------------------------------------------------------
# GODOT AWARD POPUP / OBJECTIVE WIDGETS
# ------------------------------------------------------------

widget_player:

  # ----------------------------------------------------------
  # INTRO VIDEO
  # Stays active for the entire Brain Rot mode
  # ----------------------------------------------------------

  brain_rot_intro:
    award_popup_widget:
      action: play
      priority: 5000
      tokens:
        award_text: "CONSUME"
        award_video: "tl-v-aerobic"


  # ----------------------------------------------------------
  # STAGE 1 - HIT LEFT SPINNER
  # ----------------------------------------------------------

  brain_rot_left_spinner_objective:
    objective_widget:
      action: play
      priority: 6000
      tokens:
        award_text: |
          HIT LEFT
          SPINNER


  # ----------------------------------------------------------
  # STAGE 2 - LEFT SAUCER OPEN
  # ----------------------------------------------------------

  brain_rot_left_saucer_open:
    objective_widget:
      action: update
      tokens:
        award_text: |
          LEFT LOCK
          LIT


  # ----------------------------------------------------------
  # STAGE 3 - HIT RIGHT SPINNER
  # ----------------------------------------------------------

  brain_rot_right_spinner_objective:
    objective_widget:
      action: update
      tokens:
        award_text: |
          HIT RIGHT
          SPINNER


  # ----------------------------------------------------------
  # STAGE 4 - RIGHT SAUCER OPEN
  # ----------------------------------------------------------

  brain_rot_right_saucer_open:
    objective_widget:
      action: update
      tokens:
        award_text: |
          RIGHT LOCK
          LIT


  # ----------------------------------------------------------
  # STAGE 5 - HIT VARI TARGET
  # ----------------------------------------------------------

  brain_rot_varitarget_objective:
    objective_widget:
      action: update
      tokens:
        award_text: |
          HIT VARI
          TARGET


  # ----------------------------------------------------------
  # MODE WON
  # Remove objective and replace/update intro popup
  # ----------------------------------------------------------

  brain_rot_reward_won:

    objective_widget:
      action: remove

    award_popup_widget:
      action: remove

    brain_rot_pass_widget:
      action: play
      priority: 9000
      tokens:
        award_text: |
          BRAIN ROT
          BROKEN


  # ----------------------------------------------------------
  # MODE FAILED
  # Remove objective and replace/update intro popup
  # ----------------------------------------------------------

  brain_rot_failed:

    objective_widget:
      action: remove

    award_popup_widget:
      action: remove

    brain_rot_fail_widget:
      action: play
      priority: 9000
      tokens:
        award_text: |
          BRAIN ROT
          FAILED