#show_version=6

# ------------------------------------------------------------
# CONSUME ACTIVE
#
# Used after CONSUME has already been completed once.
# Alternates all three CONSUME inserts RED / BLUE.
# ------------------------------------------------------------

- duration: 300ms
  lights:
    l_pf1_4_13: red
    l_pf1_4_14: red
    l_pf1_4_15: red

- duration: 300ms
  lights:
    l_pf1_4_13: blue
    l_pf1_4_14: blue
    l_pf1_4_15: blue

- duration: 100ms
  lights:
    l_pf1_4_13: red
    l_pf1_4_14: red
    l_pf1_4_15: red

- duration: 100ms
  lights:
    l_pf1_4_13: blue
    l_pf1_4_14: blue
    l_pf1_4_15: blue