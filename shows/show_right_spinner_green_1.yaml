#show_version=6
# Right spinner entry green directional show
#
# Insert 1 (bottom):
#   l_pf1_1_30
#
# Insert 2 (middle):
#   l_pf1_1_31
#
# Insert 3 (top / right spinner entry ring):
#   l_pf1_2_16, l_pf1_2_17, l_pf1_2_18,
#   l_pf1_2_19, l_pf1_2_20, l_pf1_2_21
#
# Effect:
#   - Inserts 1 -> 2 chase upward at 180ms.
#   - Insert 3 pulses continuously throughout the whole show.
#   - Ring pulse uses multiple brightness levels rather than switching fully off,
#     so it stays visibly bright.

# ------------------------------------------------------------
# STEP 1 - BOTTOM INSERT ON / RING BRIGHT
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '00FF00'
    l_pf1_1_31: '000000'

    l_pf1_2_16: '00FF00'
    l_pf1_2_17: '00FF00'
    l_pf1_2_18: '00FF00'
    l_pf1_2_19: '00FF00'
    l_pf1_2_20: '00FF00'
    l_pf1_2_21: '00FF00'

# ------------------------------------------------------------
# STEP 2 - MIDDLE INSERT ON / RING DIMMER
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '000000'
    l_pf1_1_31: '00FF00'

    l_pf1_2_16: '009000'
    l_pf1_2_17: '009000'
    l_pf1_2_18: '009000'
    l_pf1_2_19: '009000'
    l_pf1_2_20: '009000'
    l_pf1_2_21: '009000'

# ------------------------------------------------------------
# STEP 3 - BOTH LOWER INSERTS OFF / RING FULL BRIGHT
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '000000'
    l_pf1_1_31: '000000'

    l_pf1_2_16: '00FF00'
    l_pf1_2_17: '00FF00'
    l_pf1_2_18: '00FF00'
    l_pf1_2_19: '00FF00'
    l_pf1_2_20: '00FF00'
    l_pf1_2_21: '00FF00'

# ------------------------------------------------------------
# STEP 4 - BOTTOM INSERT ON AGAIN / RING MEDIUM
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '00FF00'
    l_pf1_1_31: '000000'

    l_pf1_2_16: '005000'
    l_pf1_2_17: '005000'
    l_pf1_2_18: '005000'
    l_pf1_2_19: '005000'
    l_pf1_2_20: '005000'
    l_pf1_2_21: '005000'

# ------------------------------------------------------------
# STEP 5 - MIDDLE INSERT ON / RING BRIGHT
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '000000'
    l_pf1_1_31: '00FF00'

    l_pf1_2_16: '00D000'
    l_pf1_2_17: '00D000'
    l_pf1_2_18: '00D000'
    l_pf1_2_19: '00D000'
    l_pf1_2_20: '00D000'
    l_pf1_2_21: '00D000'

# ------------------------------------------------------------
# STEP 6 - RING FULL BRIGHT PEAK
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '000000'
    l_pf1_1_31: '000000'

    l_pf1_2_16: '00FF00'
    l_pf1_2_17: '00FF00'
    l_pf1_2_18: '00FF00'
    l_pf1_2_19: '00FF00'
    l_pf1_2_20: '00FF00'
    l_pf1_2_21: '00FF00'

# ------------------------------------------------------------
# STEP 7 - SOFT RING DIP / BOTTOM INSERT RESTARTS
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '00FF00'
    l_pf1_1_31: '000000'

    l_pf1_2_16: '007000'
    l_pf1_2_17: '007000'
    l_pf1_2_18: '007000'
    l_pf1_2_19: '007000'
    l_pf1_2_20: '007000'
    l_pf1_2_21: '007000'

# ------------------------------------------------------------
# STEP 8 - MIDDLE INSERT / RING BUILD
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '000000'
    l_pf1_1_31: '00FF00'

    l_pf1_2_16: '00B000'
    l_pf1_2_17: '00B000'
    l_pf1_2_18: '00B000'
    l_pf1_2_19: '00B000'
    l_pf1_2_20: '00B000'
    l_pf1_2_21: '00B000'

# ------------------------------------------------------------
# STEP 9 - FULL RING PEAK
# ------------------------------------------------------------
- duration: 180ms
  lights:
    l_pf1_1_30: '000000'
    l_pf1_1_31: '000000'

    l_pf1_2_16: '00FF00'
    l_pf1_2_17: '00FF00'
    l_pf1_2_18: '00FF00'
    l_pf1_2_19: '00FF00'
    l_pf1_2_20: '00FF00'
    l_pf1_2_21: '00FF00'
