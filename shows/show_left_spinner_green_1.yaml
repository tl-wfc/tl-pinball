#show_version=6
# Left spinner entry green show - brighter, faster, longer
#
# Insert 1:
#   l_pf1_3_21, l_pf1_3_22, l_pf1_3_23
#
# Insert 2 ring:
#   l_pf1_3_26, l_pf1_3_27, l_pf1_3_28,
#   l_pf1_3_29, l_pf1_3_30, l_pf1_3_31
#
# Main chase timing is 120ms for faster movement.
# Pulses use 90-150ms depending on effect.
# Most steps keep LEDs at full green for better brightness.

