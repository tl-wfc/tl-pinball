    l_pf2_7_9: ff0000
    l_pf2_7_10: ff0000
    l_pf2_7_11: ff0000
    l_pf2_7_12: ff0000

    # Top ring
    l_pf2_7_17: ff0000
    l_pf2_7_18: ff0000
    l_pf2_7_19: ff0000
    l_pf2_7_20: ff0000
    l_pf2_7_21: ff0000
    l_pf2_7_22: ff0000
    l_pf2_7_23: ff0000
    l_pf2_7_24: ff0000
    l_pf2_7_25: ff0000
    l_pf2_7_26: ff0000
