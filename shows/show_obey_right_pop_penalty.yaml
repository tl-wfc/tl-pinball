#show_version=6
#
# OBEY - RIGHT POP PENALTY
#
# Fast expanding RED shockwave ring.
# Starts at right pop bumper and expands outward.
#
# Previous ring turns OFF as next ring illuminates.
# Total duration ~300ms.


# ==========================================================
# STEP 1 - RIGHT POP BUMPER
# ==========================================================

- duration: 45ms
  lights:

    # Bottom ring
    l_pf2_7_1: ff0000
    l_pf2_7_2: ff0000
    l_pf2_7_3: ff0000
